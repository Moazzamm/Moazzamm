<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 260px; margin: 0; padding: 16px; font: 14px system-ui, sans-serif; }
  h1 { font-size: 15px; margin: 0 0 12px; }
  button { width: 100%; padding: 10px; border: 0; border-radius: 8px; background: #1a73e8; color: #fff; font-weight: 600; cursor: pointer; }
  button:disabled { background: #9bbcf0; cursor: default; }
  label { display: block; margin: 10px 0 0; font-size: 12px; color: #444; }
  #status { margin-top: 12px; font-size: 12px; color: #333; white-space: pre-wrap; }
</style>
</head>
<body>
  <h1>Mobbin Screen Downloader</h1>
  <button id="go">Download all screens</button>
  <label><input type="checkbox" id="all"> Include non-phone images (web screens, icons)</label>
  <div id="status">Open a Mobbin flows page, then click the button.</div>
  <script src="popup.js"></script>
</body>
</html>
