<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"line1","type":"string","label":"Line 1","default":"In 2010 a landslide"},
    {"id":"line2","type":"string","label":"Line 2 (the punch)","default":"DROWNED A HIGHWAY"},
    {"id":"line3","type":"string","label":"Line 3","default":"and created a turquoise lake."},
    {"id":"accent","type":"color","label":"Accent","default":"#2EC4B6"},
    {"id":"showBackground","type":"boolean","label":"Solid background (off = transparent overlay)","default":true},
    {"id":"length","type":"number","label":"Length (s), stretch to fit the voice line","default":5,"min":5,"max":60,"step":0.1}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Faceless — Kinetic Text</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Bebas Neue"; src: url("assets/fonts/bebas-neue-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
      @font-face { font-family: "Inter"; src: url("assets/fonts/inter-latin-500-normal.woff2") format("woff2"); font-weight: 500; }
      html, body { margin: 0; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; color: #f3e7d3; }
      .clip { position: absolute; inset: 0; }
      #bg { position: absolute; inset: 0; background: radial-gradient(1300px 800px at 50% 50%, #142a36, #070d12 75%); }
      #stack { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
      .l { white-space: nowrap; }
      #l1, #l3 { font: 500 58px/1.1 Inter, sans-serif; letter-spacing: -0.01em; }
      #l2 { font: 400 210px/0.9 "Bebas Neue", sans-serif; letter-spacing: 0.02em; color: var(--accent); }
      .w { display: inline-block; margin: 0 0.12em; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="kinetic-text" data-start="0" data-width="1920" data-height="1080">
      <section id="kt" class="clip" data-start="0" data-duration="5" data-track-index="0">
        <div id="bg"></div>
        <div id="stack">
          <div class="l" id="l1"></div>
          <div class="l" id="l2"></div>
          <div class="l" id="l3"></div>
        </div>
      </section>
    </div>
    <script>
      const vars = window.__hyperframes.getVariables();
      if (!vars.showBackground) document.getElementById("bg").style.display = "none";
      const words = (id, text) => {
        const el = document.getElementById(id);
        for (const w of text.split(" ")) {
          const s = document.createElement("span");
          s.className = "w";
          s.textContent = w;
          el.appendChild(s);
        }
      };
      words("l1", vars.line1);
      words("l2", vars.line2);
      words("l3", vars.line3);

      const L = Math.max(5, Number(window.__hyperframes.getVariables().length) || 5);
      document.getElementById("kt").setAttribute("data-duration", L);
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#l1 .w", { opacity: 0, y: 30, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out", stagger: 0.08 }, 0.15)
        .fromTo("#l2 .w", { opacity: 0, scale: 1.6, filter: "blur(14px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.45, ease: "expo.out", stagger: 0.12 }, 0.9)
        .fromTo("#stack", { x: 0 }, { x: 6, duration: 0.05, yoyo: true, repeat: 3, ease: "none" }, 0.95)
        .fromTo("#l3 .w", { opacity: 0, y: 20 }, { opacity: 0.9, y: 0, duration: 0.45, ease: "power2.out", stagger: 0.06 }, 1.8)
        .fromTo("#stack", { scale: 1 }, { scale: 1.04, duration: L - 0.7, ease: "none" }, 0.2)
        .to("#stack", { opacity: 0, y: -20, duration: 0.4, ease: "power2.in" }, L - 0.45);
      window.__timelines["kinetic-text"] = tl;
    </script>
  </body>
</html>
